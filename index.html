<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jeez.games — Game Previews</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 4rem 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { color: #888; margin-bottom: 3rem; font-size: 1.1rem; }
    .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 960px; width: 100%; }
    .game-card { background: #1a1a2e; border-radius: 12px; padding: 2rem; text-decoration: none; color: #e0e0e0; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #2a2a4a; }
    .game-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(102, 126, 234, 0.2); border-color: #667eea; }
    .game-card h2 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .game-card p { color: #999; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>jeez.games</h1>
  <p class="subtitle">Preview deployments — play our games in-browser</p>
  <div class="games">
    <a class="game-card" href="/2048/">
      <h2>2048</h2>
      <p>Number merge puzzle — slide tiles to reach 2048</p>
    </a>
    <a class="game-card" href="/flappy-bird/">
      <h2>Flappy Bird</h2>
      <p>Tap to fly through pipes — how far can you go?</p>
    </a>
    <a class="game-card" href="/cookie-clicker/">
      <h2>Cookie Clicker</h2>
      <p>Idle/incremental — click cookies, buy upgrades</p>
    </a>
  </div>
</body>
</html>
