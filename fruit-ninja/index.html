<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#12101f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Juice Pop — Slice the Fruit</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #12101f;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12101f;
      }
      #game-wrap {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas#game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #hud > * {
        pointer-events: auto;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 90% at 50% 25%, #2a2146 0%, #12101f 70%);
        color: #f4d9ff;
        z-index: 20;
        font:
          600 18px/1.4 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        padding: 12px 24px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        font:
          700 17px/1 system-ui,
          sans-serif;
        color: #fff;
        background: linear-gradient(180deg, #f060a0 0%, #d84a8f 100%);
        box-shadow: 0 5px 18px rgba(240, 96, 160, 0.4);
      }
      .btn:active {
        transform: translateY(1px);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-IXefKwsL.js"></script>
  </head>
  <body>
    <div id="stage">
      <div id="game-wrap">
        <canvas id="game"></canvas>
        <div id="hud"></div>
        <div id="boot">Juice Pop</div>
      </div>
    </div>
  </body>
</html>
