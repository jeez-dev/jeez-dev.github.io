    <style>
      /* Fleet fonts (JEE-195/JEE-203): self-hosted Fredoka 600 + Nunito 400/700/800.
         Same woff2 files as crossy-road / jeez-water-sort, served from public/fonts/. */
      @font-face {
        font-family: 'Fredoka';
        font-weight: 600;
        font-style: normal;
        font-display: swap;
        src: url('./fonts/fredoka-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Nunito';
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        src: url('./fonts/nunito-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Nunito';
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        src: url('./fonts/nunito-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Nunito';
        font-weight: 800;
        font-style: normal;
        font-display: swap;
        src: url('./fonts/nunito-800.woff2') format('woff2');
      }
      /* Boot splash (JEE-225; fleet Water Sort pattern): paints inline before the
         JS bundle executes; main.ts removes #boot on the first rendered frame.
         Background gradient = the menu night-sky dome stops in three-scene.ts,
         so removal flashes zero against the first frame. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(180deg, #2c3870 0%, #1a2450 42%, #070a1c 100%);
        color: #2fd673;
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
        animation: ga-boot-in 0.25s ease-out;
      }
      #boot .boot-icon {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 0 16px rgba(47, 214, 115, 0.5));
      }
      #boot .boot-title {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #ffffff;
        text-shadow: 0 0 22px rgba(47, 214, 115, 0.45);
      }
      #boot .boot-title span {
        color: #ffd23f;
        text-shadow: 0 0 22px rgba(255, 210, 63, 0.45);
      }
      #boot .boot-dots {
        display: flex;
        gap: 8px;
      }
      #boot .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2fd673;
        animation: ga-boot-dot 1s ease-in-out infinite;
      }
      #boot .boot-dots span:nth-child(2) {
        animation-delay: 0.15s;
        background: #3f8cff;
      }
      #boot .boot-dots span:nth-child(3) {
        animation-delay: 0.3s;
        background: #ffd23f;
      }
      @keyframes ga-boot-dot {
        0%,
        100% {
          transform: scale(0.6);
          opacity: 0.4;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes ga-boot-in {
        from {
          opacity: 0;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DPIAiqEx.js"></script>

          <path
