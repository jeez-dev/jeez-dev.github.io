<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b13" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/nunito-700.woff2" as="font" type="font/woff2" crossorigin />
    <title>Chain Reaction — jeez.games</title>
    <meta name="description" content="Deterministic cascade puzzle. Place sparks, ignite, watch the chain reaction." />
    <script type="module" crossorigin src="./assets/index-CTaJeebG.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BZws4Gnf.css">
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
        <svg class="boot-mark" viewBox="0 0 64 64">
          <defs>
            <linearGradient id="bootg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffb37c" /><stop offset="1" stop-color="#f56f14" />
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bootg)" />
          <path d="M32 16l4.4 15.6L52 32l-15.6 4.4L32 52l-4.4-15.6L12 32l15.6-4.4L32 16z" fill="#1a0e04" />
        </svg>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>

    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffb37c" /><stop offset="1" stop-color="#f56f14" />
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#brandg)" />
          <path d="M32 16l4.4 15.6L52 32l-15.6 4.4L32 52l-4.4-15.6L12 32l15.6-4.4L32 16z" fill="#1a0e04" />
        </svg>
        <h1>CHAIN <span class="accent">REACTION</span></h1>
      </div>
      <div class="header-controls">
        <select id="boardSelect" aria-label="Board"></select>
        <button id="newEndlessBtn" class="btn ghost" data-icon="infinity" title="New procedurally generated board"><span class="lbl">Endless</span></button>
        <button id="muteBtn" class="btn ghost icon-btn" aria-pressed="false" aria-label="Mute sound" title="Toggle sound"></button>
      </div>
    </header>

    <main>
      <section class="board-wrap">
        <canvas id="board" width="672" height="504" aria-label="Puzzle board"></canvas>
        <div id="overlay" class="overlay hidden" aria-live="polite">
          <div class="overlay-card">
            <div id="overlayHeadline" class="headline"></div>
            <div id="overlayStars" class="stars"></div>
            <div id="overlayScore" class="score"></div>
            <div id="overlayProgress" class="progress"></div>
            <div id="overlayBest" class="best"></div>
            <div class="overlay-actions">
              <button id="retryBtn" class="btn ghost" data-icon="undo"><span class="lbl">Edit board</span></button>
              <button id="nextBtn" class="btn primary" data-icon="arrowRight"><span class="lbl">Next</span></button>
            </div>
          </div>
        </div>
        <div id="toast" class="toast hidden" role="status"></div>
        <div id="combo" class="combo hidden" aria-hidden="true">
          <span class="combo-x">×2</span>
          <span class="combo-label">chain</span>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-block info">
          <div class="board-name" id="boardName"></div>
          <div class="objective" ><span class="obj-ico" data-icon="target"></span><span id="objectiveText"></span></div>
          <div class="hint" id="hintText"></div>
        </div>
        <div class="panel-block stats">
          <div class="row"><span class="rlabel">Sparks</span><span id="sparkPips" class="pips"></span></div>
          <div class="row"><span class="rlabel">Score</span><span id="scoreText" class="val">0</span></div>
          <div class="row"><span class="rlabel">Best</span><span id="bestText" class="val">—</span></div>
          <div class="row"><span class="rlabel">Progress</span><span id="progressText" class="val">—</span></div>
        </div>
        <div class="panel-block controls">
          <button id="igniteBtn" class="btn primary big" data-icon="flame"><span class="lbl">IGNITE</span><kbd>Space</kbd></button>
          <div class="btn-row">
            <button id="editBtn" class="btn ghost" data-icon="pencil" title="Back to editing (R)"><span class="lbl">Edit</span></button>
            <button id="clearBtn" class="btn ghost" data-icon="trash" title="Remove all sparks (C)"><span class="lbl">Clear</span></button>
          </div>
          <div class="btn-row">
            <button id="speedBtn" class="btn ghost" data-icon="gauge" title="Playback speed"><span class="lbl">1×</span></button>
            <button id="restartBtn" class="btn ghost" data-icon="replay" title="Replay cascade"><span class="lbl">Replay</span></button>
          </div>
        </div>
        <div class="panel-block legend" aria-label="Tile legend">
          <div class="legend-row"><span class="chip bomb"><svg viewBox="0 0 24 24"><circle cx="10" cy="14.5" r="6.5" fill="currentColor"/><path d="M14.9 9.1c.6-2.1 2.2-3 4-2.8M19.5 2.8l.9-.9M21.4 5.4h1.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span><span class="lg-name">Bomb</span><span class="lg-effect">Radial blast</span></div>
          <div class="legend-row"><span class="chip gear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke-width="2.3"/><circle cx="12" cy="12" r="3.4"/></svg></span><span class="lg-name">Gear</span><span class="lg-effect">Pulse, rotates</span></div>
          <div class="legend-row"><span class="chip portal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="7.6"/><circle cx="12" cy="12" r="3.4"/></svg></span><span class="lg-name">Portal</span><span class="lg-effect">Teleports pulse</span></div>
          <div class="legend-row"><span class="chip wall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/><path d="M8.5 15.5l7-7"/></svg></span><span class="lg-name">Wall</span><span class="lg-effect">Blocks everything</span></div>
          <div class="legend-row"><span class="chip spark"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2L12 2z" fill="currentColor"/></svg></span><span class="lg-name">Spark</span><span class="lg-effect">Your ignition</span></div>
        </div>
        <div class="panel-block tip">Identical board + sparks ⇒ identical cascade. Replays are exact.</div>
      </aside>
    </main>

    <footer><span class="foot-brand">chain reaction</span> · jeez.games</footer>
  </body>
</html>
