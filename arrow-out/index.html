    <style>
      /* Critical shell only — full styles in src/game/ui/style.css (bundled by Vite). */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121021;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
        touch-action: none;
        position: absolute;
        inset: 0;
      }
      /* Boot splash — removed by main.ts once the game is live. */
      #splash {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #121021;
        transition: opacity 0.25s ease;
      }
      #splash.splash-out {
        opacity: 0;
      }
      #splash .splash-mark {
        width: 56px;
        height: 56px;
        animation: splashPulse 1.1s ease-in-out infinite;
      }
      #splash .splash-word {
        color: #ff8c42;
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 4px;
      }
      @keyframes splashPulse {
        0%,
        100% {
          transform: translateX(-6px);
          opacity: 0.65;
        }
        50% {
          transform: translateX(6px);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-mark {
          animation: none;
        }
      }
    </style>
