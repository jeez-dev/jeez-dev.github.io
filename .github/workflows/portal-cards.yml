name: Portal cards

# JEE-668 release gate: every deploy pushes game bytes into this repo WITHOUT a
# portal card (the defect this workflow closes). On any content push to main,
# reconcile root index.html cards against deployed game dirs and push a
# follow-up commit adding any missing cards. Additive-only; deliberate removals
# must be recorded in scripts/portal-cards.mjs DELISTED.

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html   # our own follow-up commit touches only this file
  workflow_dispatch:

concurrency:
  group: portal-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile portal cards + push if needed
        run: |
          set -euo pipefail
          git config user.name "jeez-portal-bot"
          git config user.email "engineering@jeez.games"
          for attempt in 1 2 3; do
            git pull --rebase -q origin main
            node scripts/portal-cards.mjs
            if git diff --quiet -- index.html; then
              echo "Portal parity OK — every deployed game is listed."
              exit 0
            fi
            # Slugs added by the reconciler (added lines only — a diff from this
            # script is pure insertions, so context lines can never leak in).
            added=$(git diff -- index.html | grep -E '^\+' | grep -oE 'class="game-card" href="/[^"]+/' | sed -E 's|.*href="/([^/]+)/|\1|' | sort -u | paste -sd, -)
            git add index.html
            git commit -q -m "portal: add missing game cards: ${added}" \
              -m "JEE-668 — auto-generated by the portal-cards workflow." \
              -m "Co-Authored-By: Paperclip <noreply@paperclip.ing>"
            if git push -q origin main; then
              echo "Pushed portal card follow-up commit for: ${added}"
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error title=Portal parity::failed to push card commit after 3 attempts (concurrent deploy pushes)"
              exit 1
            fi
            # Another push raced us; loop rebases and retries. Reset the failed commit first.
            git reset -q --hard origin/main
            sleep 5
          done
