    <style>
      /* Fleet fonts (JEE-195): bundled self-hosted faces, relative fonts/ paths. */
      @font-face {
        font-family: 'Fredoka';
        src: url('fonts/fredoka-600.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('fonts/nunito-400.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('fonts/nunito-700.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('fonts/nunito-800.woff2') format('woff2');
        font-weight: 800;
        font-display: swap;
      }
      /* Critical shell only — full styles in src/game/ui/style.css (bundled by Vite). */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1b2a;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Nunito', system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
        touch-action: none;
        position: absolute;
        inset: 0;
      }
      /* Boot splash (JEE-223) — paints before the JS bundle; removed on the
         first rendered frame by src/game/main.ts. Background matches the
         game's sky gradient exactly so removal has zero flash. */
      #boot {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(180deg, #0a1524 0%, #0d1b2a 45%, #081120 100%);
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
        animation: wc-boot-in 0.25s ease-out;
      }
      #boot .boot-icon {
        width: 104px;
        height: auto;
        filter: drop-shadow(0 0 16px rgba(244, 162, 89, 0.5));
      }
      #boot .boot-title {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #ffe9c9;
        text-shadow: 0 0 22px rgba(244, 162, 89, 0.45);
      }
      #boot .boot-dots {
        display: flex;
        gap: 8px;
      }
      #boot .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f4a259;
        animation: wc-boot-dot 1s ease-in-out infinite;
      }
      #boot .boot-dots span:nth-child(2) {
        animation-delay: 0.15s;
        background: #2ec4b6;
      }
      #boot .boot-dots span:nth-child(3) {
        animation-delay: 0.3s;
        background: #ffd803;
      }
      @keyframes wc-boot-dot {
        0%,
        100% {
          transform: scale(0.6);
          opacity: 0.4;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes wc-boot-in {
        from {
          opacity: 0;
        }
      }
    </style>
