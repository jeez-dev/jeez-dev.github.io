<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="./assets/favicon-CXgTycbr.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0f0e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Color Sort Rush — jeez.games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0f0e17; --surface: #1a1932; --surface2: #232244;
      --accent: #ff6e6c; --accent2: #7f5af0;
      --gold: #ffd803; --text: #fffffe; --text-dim: #94a1b2; --text-dimmer: #6b7086;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      touch-action: none; -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none;
    }
    .hidden { display: none !important; }
    #app { position: fixed; inset: 0; max-width: 520px; margin: 0 auto; }
    #stage { position: absolute; inset: 0; outline: none; }

    /* soft edge vignette over the 3D scene */
    #vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background:
        radial-gradient(ellipse 120% 90% at 50% 45%, transparent 55%, rgba(6,5,14,0.5) 100%),
        linear-gradient(180deg, rgba(6,5,14,0.45) 0%, transparent 16%, transparent 82%, rgba(6,5,14,0.58) 100%);
    }

    /* ---------- HUD ---------- */
    #hud {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      padding: calc(10px + env(safe-area-inset-top)) 14px 0;
      display: flex; align-items: center; gap: 10px; pointer-events: none;
      opacity: 0; transition: opacity .25s;
    }
    #hud.on { opacity: 1; }
    .hud-chip {
      font-size: 12px; font-weight: 800; letter-spacing: .05em;
      color: #cdd3ff; background: rgba(16,14,34,0.6);
      border: 1px solid rgba(127,90,240,0.35); border-radius: 999px;
      padding: 6px 11px; backdrop-filter: blur(6px);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #hud-streak:empty { display: none; }
    #hud-spacer { flex: 1; }
    #hud-timer-wrap {
      position: absolute; left: 50%; transform: translateX(-50%);
      top: calc(12px + env(safe-area-inset-top)); text-align: center;
      pointer-events: none; z-index: 5; opacity: 0; transition: opacity .25s;
    }
    #hud-timer-wrap.on { opacity: 1; }
    #hud-timer {
      font-size: clamp(34px, 10vw, 50px); font-weight: 900; line-height: 1;
      color: #fff; text-shadow: 0 2px 14px rgba(127,90,240,0.5), 0 1px 2px rgba(0,0,0,0.6);
      font-variant-numeric: tabular-nums;
    }
    #hud-timer.warning { color: var(--accent); animation: timerPulse 0.9s ease-in-out infinite; }
    #hud-timer.casual { color: #a3f7cc; text-shadow: 0 2px 14px rgba(44,182,125,0.5); }
    @keyframes timerPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

    #controls {
      position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom));
      display: flex; justify-content: center; gap: 10px; z-index: 5;
      opacity: 0; transition: opacity .25s;
    }
    #controls.on { opacity: 1; }
    .ctrl-btn {
      min-width: 68px; min-height: 44px; padding: 10px 16px;
      border-radius: 14px; border: 1px solid rgba(127,90,240,0.4);
      background: rgba(16,14,34,0.72); color: var(--text);
      font: inherit; font-size: 13.5px; font-weight: 800; letter-spacing: .04em;
      cursor: pointer; backdrop-filter: blur(8px);
      touch-action: manipulation; transition: transform .1s, opacity .2s;
    }
    .ctrl-btn:active { transform: scale(0.94); }
    .ctrl-btn:disabled { opacity: 0.38; cursor: default; }
    .ctrl-btn .count { color: var(--accent2); font-variant-numeric: tabular-nums; }

    /* theme toast (level-start flavor) */
    #theme-toast {
      position: absolute; left: 50%; top: 20%; transform: translateX(-50%);
      font-size: 13px; font-weight: 900; letter-spacing: 0.32em; color: #cfc8ff;
      text-shadow: 0 0 18px rgba(127,90,240,0.65); opacity: 0; pointer-events: none; z-index: 6;
    }
    #theme-toast.show { animation: toastFade 1.9s ease forwards; }
    @keyframes toastFade {
      0% { opacity: 0; transform: translateX(-50%) translateY(8px); }
      18% { opacity: 1; transform: translateX(-50%) translateY(0); }
      72% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ---------- screens ---------- */
    .screen {
      position: absolute; inset: 0; z-index: 8; display: none;
      flex-direction: column; align-items: center;
    }
    .screen.active { display: flex; animation: screenIn .28s ease-out; }
    @keyframes screenIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    #title-screen { justify-content: center; gap: 22px; padding: 24px; text-align: center;
      background: radial-gradient(ellipse at 50% 30%, rgba(127,90,240,0.16) 0%, transparent 70%); }
    .title-logo {
      font-size: clamp(40px, 11vw, 56px); font-weight: 900; letter-spacing: 0.05em; line-height: 1.04;
      background: linear-gradient(180deg, #ffe3e2 5%, var(--accent) 55%, var(--accent2) 105%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 22px rgba(255,110,108,0.4));
    }
    .title-sub { color: var(--text-dim); font-size: clamp(13px, 3.6vw, 15.5px); letter-spacing: 0.05em; }
    .title-tubes { display: flex; gap: 8px; justify-content: center; margin: 4px 0 2px; animation: floaty 3.2s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .title-tube { width: 20px; height: 56px; border: 2px solid rgba(207,200,255,0.35); border-top: none;
      border-radius: 0 0 8px 8px; overflow: hidden; display: flex; flex-direction: column-reverse;
      box-shadow: inset 0 2px 6px rgba(255,255,255,0.08), 0 6px 16px rgba(0,0,0,0.4); }
    .title-tube .s { height: 13px; }

    .btn {
      min-width: 208px; min-height: 54px; padding: 15px 34px; border-radius: 999px; border: none;
      cursor: pointer; font: inherit; font-weight: 900; font-size: 17px; letter-spacing: 0.14em;
      color: #16121f; background: linear-gradient(180deg, #ffd9d8, var(--accent));
      box-shadow: 0 6px 26px rgba(255,110,108,0.42), inset 0 1px 0 rgba(255,255,255,0.6);
      animation: ctaBreathe 1.7s ease-in-out infinite; touch-action: manipulation;
    }
    .btn:active { transform: scale(0.96); }
    @keyframes ctaBreathe {
      0%,100% { box-shadow: 0 6px 26px rgba(255,110,108,0.42), inset 0 1px 0 rgba(255,255,255,0.6); }
      50%    { box-shadow: 0 6px 36px rgba(255,110,108,0.66), inset 0 1px 0 rgba(255,255,255,0.6); }
    }
    .btn-secondary { background: linear-gradient(180deg, #b6a2ff, var(--accent2)); color: #f4f1ff;
      box-shadow: 0 6px 26px rgba(127,90,240,0.4), inset 0 1px 0 rgba(255,255,255,0.4); animation: none; }
    .btn-outline { background: transparent; border: 2px solid rgba(127,90,240,0.65); color: #cfc8ff;
      box-shadow: none; animation: none; }
    .btn-sm { min-width: 0; min-height: 44px; padding: 12px 22px; font-size: 13px; letter-spacing: 0.1em; }
    .btn-hint { color: var(--text-dimmer); font-size: 12px; letter-spacing: 0.08em; margin-top: 4px; }

    /* level select */
    #level-select { justify-content: flex-start; padding: calc(20px + env(safe-area-inset-top)) 16px 16px; gap: 14px;
      background: rgba(15,14,23,0.72); backdrop-filter: blur(10px); }
    .screen-head { font-size: 20px; font-weight: 900; letter-spacing: 0.18em; color: #efeaff;
      text-shadow: 0 2px 12px rgba(127,90,240,0.5); }
    .mode-toggle { display: flex; gap: 8px; background: rgba(35,34,68,0.6); border-radius: 999px; padding: 5px;
      border: 1px solid rgba(127,90,240,0.3); }
    .mode-btn { border: none; background: transparent; color: var(--text-dim); font: inherit;
      font-weight: 900; letter-spacing: 0.12em; font-size: 12.5px; padding: 9px 22px; border-radius: 999px;
      cursor: pointer; touch-action: manipulation; transition: all .18s; }
    .mode-btn.active { background: linear-gradient(180deg, #b6a2ff, var(--accent2)); color: #fff;
      box-shadow: 0 3px 14px rgba(127,90,240,0.5); }
    .level-grid-wrap { flex: 1; overflow-y: auto; width: 100%; padding: 2px 4px 8px; }
    .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; width: 100%; max-width: 360px; margin: 0 auto; }
    .level-btn { position: relative; aspect-ratio: 1; border-radius: 15px; font: inherit;
      border: 1.5px solid rgba(127,90,240,0.28); background: rgba(26,25,50,0.85);
      color: var(--text); cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
      transition: transform .1s, border-color .2s; touch-action: manipulation; }
    .level-btn:active { transform: scale(0.93); }
    .level-btn .num { font-size: 19px; font-weight: 900; }
    .level-btn .stars { font-size: 9.5px; letter-spacing: 1px; color: var(--gold); text-shadow: 0 0 8px rgba(255,216,3,0.55); }
    .level-btn .stars .empty { color: rgba(107,112,134,0.5); text-shadow: none; }
    .level-btn.locked { background: rgba(19,18,34,0.6); color: var(--text-dimmer); cursor: default;
      border-color: rgba(107,112,134,0.25); }
    .level-btn.locked .stars { visibility: hidden; }

    /* overlays (win / lose) */
    .overlay {
      position: absolute; inset: 0; z-index: 10; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      text-align: center; padding: 24px;
      background: radial-gradient(ellipse 90% 70% at 50% 42%, rgba(15,14,23,0.3), rgba(10,8,18,0.86));
      backdrop-filter: blur(4px);
    }
    .overlay.active { display: flex; animation: overlayIn .32s cubic-bezier(0.2,1.4,0.4,1); }
    @keyframes overlayIn { 0% { opacity: 0; transform: scale(0.86); } 100% { opacity: 1; transform: scale(1); } }
    .overlay-title { font-size: clamp(34px, 9.5vw, 46px); font-weight: 900; letter-spacing: 0.08em; }
    #win-overlay .overlay-title { color: var(--gold); text-shadow: 0 0 30px rgba(255,216,3,0.5); }
    #lose-overlay .overlay-title { color: var(--accent); text-shadow: 0 0 30px rgba(255,110,108,0.5); }
    .star-display { font-size: clamp(38px, 11vw, 50px); display: flex; gap: 12px; justify-content: center; }
    .star-display .star { color: rgba(107,112,134,0.55); transition: color .2s; }
    .star-display .star.earned { color: var(--gold); text-shadow: 0 0 16px rgba(255,216,3,0.6);
      animation: starPop .42s cubic-bezier(0.2,1.6,0.4,1) backwards; }
    @keyframes starPop { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .score-line { color: var(--text-dim); font-size: 15px; line-height: 1.6; }
    .overlay-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  </style>
  <script type="module" crossorigin src="./assets/index-CUGRFsL8.js"></script>
</head>
<body>
  <div id="app">
    <div id="stage" aria-label="Color Sort Rush game area"></div>
    <div id="vignette"></div>

    <span id="fps-chip" class="hud-chip hidden" style="position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6">-- fps</span>

    <header id="hud">
      <span class="hud-chip" id="hud-level">Level 1</span>
      <span class="hud-chip" id="hud-moves">0 moves</span>
      <span id="hud-spacer"></span>
      <span class="hud-chip" id="hud-streak"></span>
    </header>
    <div id="hud-timer-wrap"><div id="hud-timer">60</div></div>
    <div id="theme-toast"></div>

    <nav id="controls">
      <button class="ctrl-btn" id="undo-btn">↶ Undo <span class="count" id="undo-count">3</span></button>
      <button class="ctrl-btn" id="btn-reset">↻ Reset</button>
      <button class="ctrl-btn" id="btn-menu">☰</button>
    </nav>

    <section class="screen active" data-screen="title" id="title-screen">
      <div class="title-logo">COLOR SORT<br/>RUSH</div>
      <div class="title-tubes" id="title-tubes"></div>
      <p class="title-sub">Sort fast. Score big.</p>
      <button class="btn" id="btn-play">PLAY</button>
      <div class="btn-hint">tap a tube, then tap where to pour — match colors to sort</div>
    </section>

    <section class="screen" data-screen="levels" id="level-select">
      <div class="screen-head">SELECT LEVEL</div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-rush">RUSH</button>
        <button class="mode-btn" id="mode-casual">CASUAL</button>
      </div>
      <div class="level-grid-wrap"><div class="level-grid" id="level-grid"></div></div>
      <button class="btn btn-outline btn-sm" id="btn-back">BACK</button>
    </section>

    <div id="win-overlay" class="overlay">
      <div class="overlay-title">SORTED!</div>
      <div class="star-display" id="win-stars"></div>
      <div class="score-line" id="win-score"></div>
      <div class="overlay-btns">
        <button class="btn btn-sm btn-secondary" id="btn-next">NEXT LEVEL</button>
        <button class="btn btn-sm btn-outline" id="btn-replay">REPLAY</button>
        <button class="btn btn-sm btn-outline" id="btn-win-levels">LEVELS</button>
      </div>
    </div>

    <div id="lose-overlay" class="overlay">
      <div class="overlay-title">TIME'S UP!</div>
      <div class="score-line" id="lose-info"></div>
      <div class="overlay-btns">
        <button class="btn btn-sm" id="btn-retry">TRY AGAIN</button>
        <button class="btn btn-sm btn-outline" id="btn-lose-levels">LEVELS</button>
      </div>
    </div>
  </div>

</body>
</html>
