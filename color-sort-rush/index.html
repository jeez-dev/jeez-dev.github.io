<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f0e17">
<title>Color Sort Rush — jeez.games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0e17;--surface:#1a1932;--surface2:#232244;--accent:#ff6e6c;--accent2:#7f5af0;
  --green:#2cb67d;--gold:#ffd803;--silver:#a7a9be;--bronze:#e0a526;
  --text:#fffffe;--text-dim:#94a1b2;--text-dimmer:#6b7086;
  --tube-w:50px;--tube-h:130px;--seg-h:30px;--radius:12px;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pourDown{0%{transform:scaleY(0);opacity:0}30%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:1}}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{width:100%;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}

.screen{display:none;flex-direction:column;align-items:center;width:100%;height:100%}
.screen.active{display:flex}

#title-screen{justify-content:center;gap:24px;padding:24px;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,rgba(127,90,240,.15) 0%,transparent 70%)}
#title-screen h1{font-size:2.6em;color:var(--accent);text-shadow:0 0 30px rgba(255,110,108,.3);letter-spacing:3px;line-height:1.1}
#title-screen .sub{color:var(--text-dim);font-size:1em;margin-top:-8px}
.title-tubes{display:flex;gap:6px;justify-content:center;margin:8px 0;animation:float 3s ease-in-out infinite}
.title-tube{width:18px;height:50px;border:2px solid var(--surface2);border-top:none;border-radius:0 0 6px 6px;overflow:hidden;display:flex;flex-direction:column-reverse}
.title-tube .s{height:12px}
.btn{background:var(--accent);color:var(--bg);border:none;padding:14px 44px;border-radius:var(--radius);font-size:1.05em;
  cursor:pointer;transition:transform .12s;font-weight:700;letter-spacing:1px}
.btn:active{transform:scale(.94)}
.btn-secondary{background:var(--accent2);color:var(--text)}
.btn-outline{background:transparent;border:2px solid var(--accent2);color:var(--accent2)}
.btn-outline:active{background:var(--accent2);color:var(--text)}
.btn-sm{padding:10px 22px;font-size:.88em;border-radius:10px}
.btn-xs{padding:6px 14px;font-size:.78em;border-radius:8px}

#level-select{padding:16px;gap:14px;overflow-y:auto}
#level-select h2{font-size:1.3em;color:var(--accent);letter-spacing:1px}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:340px}
.level-btn{aspect-ratio:1;border-radius:var(--radius);border:2px solid var(--surface2);background:var(--surface);
  color:var(--text);font-size:1.05em;font-weight:700;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;transition:transform .1s,border-color .2s}
.level-btn:active{transform:scale(.9)}
.level-btn.locked{opacity:.35;pointer-events:none;border-color:var(--surface2)}
.level-btn.unlocked{border-color:var(--accent2)}
.level-btn .stars{font-size:.55em;color:var(--gold);line-height:1}
.level-btn .stars .empty{color:var(--text-dimmer)}
.mode-toggle{display:flex;gap:8px;margin-top:4px}
.mode-toggle .mode-btn{padding:6px 16px;border-radius:8px;border:2px solid var(--surface2);
  background:transparent;color:var(--text-dim);cursor:pointer;font-size:.8em;font-weight:600;transition:all .15s}
.mode-toggle .mode-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(127,90,240,.12)}

#game-screen{padding:6px 4px;gap:0}
.hud{display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 10px}
.hud-left,.hud-right{display:flex;align-items:center;gap:10px}
.hud .timer{font-size:1.4em;font-weight:800;min-width:48px;text-align:center;
  color:var(--green);transition:color .3s}
.hud .timer.warning{color:var(--accent);animation:pulse .5s ease-in-out infinite alternate}
.hud .timer.casual{color:var(--accent2);font-size:1em;font-weight:600}
.hud .moves{color:var(--text-dim);font-size:.85em}
.hud .level-num{font-weight:700;color:var(--accent2);font-size:.9em}
.hud .streak{color:var(--gold);font-weight:700;font-size:.9em}

.tube-area{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:10px 8px;padding:8px 2px;align-content:center}
.tube-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;
  transition:transform .18s cubic-bezier(.25,.46,.45,.94)}
.tube-wrap:hover{transform:translateY(-3px)}
.tube-wrap.selected{transform:translateY(-14px)}
.tube-wrap.selected .tube{box-shadow:0 4px 20px rgba(127,90,240,.5),0 0 0 2px var(--accent2)}
.tube-wrap.completed .tube{box-shadow:0 0 12px rgba(44,182,125,.5),0 0 0 2px var(--green)}
.tube{width:var(--tube-w);height:var(--tube-h);border:2.5px solid #4a4a70;border-top:none;
  border-radius:0 0 var(--radius) var(--radius);position:relative;overflow:hidden;
  background:rgba(255,255,255,.03);display:flex;flex-direction:column-reverse;transition:box-shadow .2s}
.tube-top{width:var(--tube-w);height:5px;border:2.5px solid #4a4a70;border-bottom:none;
  border-radius:6px 6px 0 0;margin-top:-1px;background:rgba(255,255,255,.03)}
.seg{width:100%;height:var(--seg-h);position:relative;transition:height .2s ease}
.seg::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,transparent 100%);pointer-events:none}
.seg.new{animation:pourDown .25s ease-out}

.controls{display:flex;gap:8px;padding:6px 0 10px;justify-content:center;align-items:center}
.ctrl-btn{background:var(--surface2);color:var(--text-dim);border:none;padding:8px 16px;border-radius:10px;
  cursor:pointer;font-size:.8em;font-weight:600;transition:all .15s;display:flex;align-items:center;gap:4px}
.ctrl-btn:active{transform:scale(.92)}
.ctrl-btn:disabled{opacity:.25;cursor:default}
.ctrl-btn .count{background:var(--accent2);color:var(--text);border-radius:6px;padding:1px 6px;font-size:.85em}

.overlay{justify-content:center;gap:18px;padding:24px;text-align:center;
  position:absolute;inset:0;background:rgba(15,14,23,.93);z-index:10;animation:pop .35s ease-out}
.overlay h2{font-size:2em}
#win-screen h2{color:var(--gold)}
#lose-screen h2{color:var(--accent)}
.star-display{font-size:2.6em;display:flex;gap:10px;justify-content:center}
.star-display .star{color:var(--text-dimmer);transition:all .3s}
.star-display .star.earned{color:var(--gold);text-shadow:0 0 14px rgba(255,216,3,.5);animation:pop .4s ease-out}
.score-line{color:var(--text-dim);font-size:.95em;line-height:1.5}
.overlay-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

@media(max-height:640px){:root{--tube-h:100px;--seg-h:24px;--tube-w:42px}}
@media(max-height:500px){:root{--tube-h:80px;--seg-h:20px;--tube-w:38px}}
@media(max-width:440px){.tube-area{gap:8px 6px}}
</style>
</head>
<body>
<div id="app">
  <div id="title-screen" class="screen active">
    <h1>COLOR SORT<br>RUSH</h1>
    <div class="title-tubes" id="title-tubes"></div>
    <p class="sub">Sort fast. Score big.</p>
    <button class="btn" onclick="showLevels()">PLAY</button>
  </div>
  <div id="level-select" class="screen">
    <h2>SELECT LEVEL</h2>
    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-rush" onclick="setMode('rush')">RUSH</button>
      <button class="mode-btn" id="mode-casual" onclick="setMode('casual')">CASUAL</button>
    </div>
    <div class="level-grid" id="level-grid"></div>
    <button class="btn btn-outline btn-sm" onclick="showTitle()" style="margin-top:10px">BACK</button>
  </div>
  <div id="game-screen" class="screen">
    <div class="hud">
      <div class="hud-left">
        <span class="level-num" id="hud-level">Level 1</span>
        <span class="moves" id="hud-moves">0 moves</span>
      </div>
      <div class="timer" id="hud-timer">60</div>
      <div class="hud-right">
        <span class="streak" id="hud-streak"></span>
      </div>
    </div>
    <div class="tube-area" id="tube-area"></div>
    <div class="controls">
      <button class="ctrl-btn" id="undo-btn" onclick="undo()" disabled>&#8630; Undo <span class="count" id="undo-count">3</span></button>
      <button class="ctrl-btn" onclick="restartLevel()">&#8635; Reset</button>
      <button class="ctrl-btn" onclick="showLevels()">&#9776;</button>
    </div>
  </div>
  <div id="win-screen" class="screen overlay">
    <h2>SORTED!</h2>
    <div class="star-display" id="win-stars"></div>
    <div class="score-line" id="win-score"></div>
    <div class="overlay-btns">
      <button class="btn btn-sm btn-secondary" onclick="nextLevel()">NEXT LEVEL</button>
      <button class="btn btn-sm btn-outline" onclick="restartLevel()">REPLAY</button>
      <button class="btn btn-sm btn-outline" onclick="showLevels()">LEVELS</button>
    </div>
  </div>
  <div id="lose-screen" class="screen overlay">
    <h2>TIME'S UP!</h2>
    <div class="score-line" id="lose-info"></div>
    <div class="overlay-btns">
      <button class="btn btn-sm" onclick="restartLevel()">TRY AGAIN</button>
      <button class="btn btn-sm btn-outline" onclick="showLevels()">LEVELS</button>
    </div>
  </div>
</div>
<script>
const COLORS=[
  {css:'#ff6e6c',light:'#ff9a98'},
  {css:'#4c9aff',light:'#7db8ff'},
  {css:'#2cb67d',light:'#5fe0a8'},
  {css:'#ffd803',light:'#ffe566'},
  {css:'#7f5af0',light:'#a78bfa'},
  {css:'#ff9f1c',light:'#ffb84d'},
  {css:'#00b4d8',light:'#48cae4'},
  {css:'#f472b6',light:'#f9a8d4'},
];
const CAP=4;

function genLevelDefs(){
  const L=[];
  for(let i=0;i<50;i++){
    let nc,extra,time;
    if(i<8){nc=3;extra=2;time=55-i*2}
    else if(i<18){nc=4;extra=2;time=60-(i-8)*2}
    else if(i<28){nc=4;extra=1;time=55-(i-18)*2}
    else if(i<38){nc=5;extra=2;time=70-(i-28)*2}
    else{nc=6;extra=2;time=75-(i-38)*2}
    L.push({nc,extra,time:Math.max(time,25)});
  }
  return L;
}
const LEVELS=genLevelDefs();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*i+1|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function makePuzzle(nc,extra){
  const segs=[];
  for(let c=0;c<nc;c++) for(let s=0;s<CAP;s++) segs.push(c);
  let tubes;
  let attempts=0;
  do{
    shuffle(segs);
    tubes=[];
    for(let t=0;t<nc;t++) tubes.push(segs.slice(t*CAP,(t+1)*CAP));
    for(let e=0;e<extra;e++) tubes.push([]);
    attempts++;
  }while(isSolved(tubes)&&attempts<50);
  return tubes;
}

function isSolved(tubes){return tubes.every(t=>t.length===0||(t.length===CAP&&t.every(c=>c===t[0])))}

function isComplete(t){return t.length===CAP&&t.every(c=>c===t[0])}

let S={level:0,tubes:[],sel:-1,timer:60,moves:0,undos:3,hist:[],iv:null,playing:false,mode:'rush',streak:0};
let progress=JSON.parse(localStorage.getItem('csr2')||'{}');
function save(){localStorage.setItem('csr2',JSON.stringify(progress))}

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function showTitle(){
  stopTimer();
  const c=document.getElementById('title-tubes');
  c.innerHTML='';
  const sample=[[0,1,2,0],[1,2,0,1],[2,0,1,2],[],[]];
  sample.forEach(t=>{
    const d=document.createElement('div');d.className='title-tube';
    t.forEach(ci=>{const s=document.createElement('div');s.className='s';s.style.background=COLORS[ci].css;d.appendChild(s)});
    c.appendChild(d);
  });
  showScreen('title-screen');
}

let gameMode='rush';
function setMode(m){
  gameMode=m;
  document.getElementById('mode-rush').classList.toggle('active',m==='rush');
  document.getElementById('mode-casual').classList.toggle('active',m==='casual');
}

function showLevels(){
  stopTimer();
  const g=document.getElementById('level-grid');g.innerHTML='';
  for(let i=0;i<50;i++){
    const b=document.createElement('button');
    const ok=i===0||progress[i-1];
    b.className='level-btn'+(ok?' unlocked':' locked');
    const p=progress[i]||{stars:0};
    b.innerHTML=`${i+1}<div class="stars">${[1,2,3].map(n=>`<span class="${n<=p.stars?'':'empty'}">&#9733;</span>`).join('')}</div>`;
    if(ok)b.onclick=()=>startLevel(i);
    g.appendChild(b);
  }
  showScreen('level-select');
}

function startLevel(idx){
  const lv=LEVELS[idx];
  const tubes=makePuzzle(lv.nc,lv.extra);
  S={level:idx,tubes,sel:-1,timer:lv.time,moves:0,undos:3,hist:[],iv:null,playing:true,mode:gameMode,
    streak:S.streak||0,timeTotal:lv.time};
  render();
  showScreen('game-screen');
  if(S.mode==='rush')startTimer();else{document.getElementById('hud-timer').textContent='\u221E';document.getElementById('hud-timer').className='timer casual'}
}

function restartLevel(){S.streak=S.streak||0;startLevel(S.level)}
function nextLevel(){if(S.level<49)startLevel(S.level+1);else showLevels()}

function startTimer(){stopTimer();S.iv=setInterval(()=>{if(!S.playing)return;S.timer--;updateTimer();if(S.timer<=0){S.timer=0;lose()}},1000)}
function stopTimer(){if(S.iv){clearInterval(S.iv);S.iv=null}}
function updateTimer(){
  const e=document.getElementById('hud-timer');
  e.textContent=S.timer;
  e.className='timer'+(S.timer<=10?' warning':'');
}

function render(){
  const area=document.getElementById('tube-area');area.innerHTML='';
  S.tubes.forEach((tube,ti)=>{
    const w=document.createElement('div');
    w.className='tube-wrap'+(S.sel===ti?' selected':'')+(isComplete(tube)?' completed':'');
    const top=document.createElement('div');top.className='tube-top';w.appendChild(top);
    const te=document.createElement('div');te.className='tube';
    for(let si=0;si<tube.length;si++){
      const seg=document.createElement('div');seg.className='seg';
      const c=COLORS[tube[si]];
      seg.style.background=`linear-gradient(160deg,${c.light} 0%,${c.css} 100%)`;
      te.appendChild(seg);
    }
    w.appendChild(te);
    w.onclick=()=>tapTube(ti);
    area.appendChild(w);
  });
  document.getElementById('hud-level').textContent=`Level ${S.level+1}`;
  document.getElementById('hud-moves').textContent=`${S.moves} move${S.moves!==1?'s':''}`;
  if(S.mode==='rush')updateTimer();
  const ub=document.getElementById('undo-btn');
  document.getElementById('undo-count').textContent=S.undos;
  ub.disabled=S.undos<=0||S.hist.length===0;
  const sk=document.getElementById('hud-streak');
  sk.textContent=S.streak>1?`\u{1F525} x${S.streak}`:'';
}

function tapTube(ti){
  if(!S.playing)return;
  if(S.sel===-1){
    if(S.tubes[ti].length>0){S.sel=ti;render()}
  }else if(S.sel===ti){
    S.sel=-1;render();
  }else{
    pour(S.sel,ti);S.sel=-1;
  }
}

function pour(from,to){
  const src=S.tubes[from],dst=S.tubes[to];
  if(!src.length)return;
  if(dst.length>=CAP)return;
  const top=src[src.length-1];
  if(dst.length>0&&dst[dst.length-1]!==top)return;
  const pf=[...src],pt=[...dst];
  let n=0;
  while(src.length&&src[src.length-1]===top&&dst.length<CAP){dst.push(src.pop());n++}
  if(n>0){
    S.hist.push({from,to,pf,pt});
    S.moves++;
    render();
    markNewSegs(to,n);
    if(isSolved(S.tubes))win();
  }
}

function markNewSegs(ti,n){
  const wrap=document.querySelectorAll('#tube-area .tube-wrap')[ti];
  if(!wrap)return;
  const segs=wrap.querySelectorAll('.tube .seg');
  for(let i=segs.length-n;i<segs.length;i++){
    const el=segs[i];
    if(!el)continue;
    el.classList.add('new');
    el.addEventListener('animationend',()=>el.classList.remove('new'),{once:true});
  }
}

function undo(){
  if(S.undos<=0||!S.hist.length)return;
  S.undos--;
  const h=S.hist.pop();
  S.tubes[h.from]=h.pf;S.tubes[h.to]=h.pt;
  S.moves=Math.max(0,S.moves-1);
  render();
}

function getStars(left,total){
  if(S.mode==='casual')return S.moves<=(LEVELS[S.level].nc*CAP*1.5)?3:S.moves<=(LEVELS[S.level].nc*CAP*2.5)?2:1;
  const r=left/total;
  if(r>=.55)return 3;
  if(r>=.25)return 2;
  return 1;
}

function win(){
  S.playing=false;stopTimer();
  const stars=getStars(S.timer,S.timeTotal);
  S.streak=(S.streak||0)+1;
  const prev=progress[S.level];
  if(!prev||prev.stars<stars){progress[S.level]={stars};save()}
  if(S.level<49&&!progress[S.level+1]){progress[S.level+1]={stars:0};save()}
  const sd=document.getElementById('win-stars');
  sd.innerHTML=[1,2,3].map(i=>`<span class="star ${i<=stars?'earned':''}" style="animation-delay:${i*.15}s">&#9733;</span>`).join('');
  const timeStr=S.mode==='rush'?`Time left: ${S.timer}s`:'Casual mode';
  document.getElementById('win-score').innerHTML=`${timeStr} &middot; ${S.moves} moves${S.streak>1?` &middot; Streak x${S.streak}`:''}`;
  showScreen('win-screen');
}

function lose(){
  S.playing=false;stopTimer();S.streak=0;
  document.getElementById('lose-info').textContent=`Level ${S.level+1} \u2014 ran out of time with ${S.moves} moves`;
  showScreen('lose-screen');
}

document.addEventListener('keydown',e=>{
  if((e.key==='z'||e.key==='Z')&&(e.ctrlKey||e.metaKey)){e.preventDefault();undo()}
  if(e.key==='Escape'){S.sel=-1;render()}
});

showTitle();
</script>
</body>
</html>
