<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#150f1e" />
  <title>2048 — jeez.games</title>
  <style>
    @font-face {
      font-family: 'Fredoka';
      src: url('fonts/fredoka-600.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'Nunito';
      src: url('fonts/nunito-400.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Nunito';
      src: url('fonts/nunito-700.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Nunito';
      src: url('fonts/nunito-800.woff2') format('woff2');
      font-weight: 800;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* dusk "ember" gradient mirrors the in-canvas backdrop so the letterbox
         bars fade seamlessly into the scene */
      background: linear-gradient(180deg, #2d2338 0%, #150f1e 78%);
      font-family: 'Nunito', system-ui, sans-serif;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    canvas { display: block; }
    /* Boot splash (fleet template, JEE-216) — painted from raw HTML/CSS before
       the JS bundle executes; removed on the first rendered frame by main.js.
       Background matches the page's dusk-ember gradient (plus a soft amber
       glow), so removal has zero flash. */
    #boot {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background:
        radial-gradient(ellipse at 50% 36%, rgba(242,162,89,0.10) 0%, transparent 62%),
        linear-gradient(180deg, #2d2338 0%, #150f1e 78%);
      font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      animation: g2048-boot-in 0.25s ease-out;
    }
    #boot .boot-icon {
      width: 72px; height: 72px;
      filter: drop-shadow(0 0 18px rgba(252,192,42,0.5));
    }
    #boot .boot-title {
      font-size: clamp(24px, 7vw, 32px); font-weight: 600; letter-spacing: 0.02em; color: #ffd166;
      text-shadow: 0 2px 0 rgba(60,36,10,0.55), 0 0 24px rgba(252,192,42,0.4);
    }
    #boot .boot-dots { display: flex; gap: 8px; }
    #boot .boot-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ffd166;
      animation: g2048-boot-dot 1s ease-in-out infinite;
    }
    #boot .boot-dots span:nth-child(2) { animation-delay: 0.15s; background: #f9643e; }
    #boot .boot-dots span:nth-child(3) { animation-delay: 0.3s; background: #8b5cf6; }
    @keyframes g2048-boot-dot {
      0%, 100% { transform: scale(0.6); opacity: 0.4; }
      50% { transform: scale(1); opacity: 1; }
    }
    @keyframes g2048-boot-in { from { opacity: 0; } }

    /* ================= fleet chrome (JEE-239) =================
       DOM layer over the canvas: HUD + start menu + game-over + win overlays.
       Fleet pattern (crossy-road): #hud, .screen.active, Fredoka titles with
       text-shadow, gradient+pulse CTA. Palette: dusk-ember (JEE-161 theme).
       Hidden chrome is display:none — nothing invisible ever blocks canvas. */

    #hud {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: none;                 /* .active flips to flex */
      gap: 10px;
      z-index: 20;
      pointer-events: none;          /* HUD is display-only; zero event capture */
    }
    #hud.active { display: flex; }
    .hud-pill {
      min-width: 96px;
      padding: 7px 14px 9px;
      text-align: center;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .hud-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: rgba(244, 237, 227, 0.62);
    }
    .hud-value {
      font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.15;
      color: #f4ede3;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }
    .hud-pill.bump .hud-value {
      animation: hud-bump 0.28s ease-out;
    }
    @keyframes hud-bump {
      40% { transform: scale(1.22); }
    }

    .screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;                 /* .active flips to flex — pointer capture */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .screen.active {
      display: flex;
      animation: screen-in 0.24s ease-out;
    }
    @keyframes screen-in {
      from { opacity: 0; transform: scale(1.03); }
    }
    .screen .title {
      font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #ffd166;
      font-size: clamp(52px, 16vw, 88px);
      line-height: 1.05;
      text-shadow: 0 3px 0 rgba(60, 36, 10, 0.55), 0 8px 28px rgba(0, 0, 0, 0.35);
    }
    .screen .sub {
      margin-top: 10px;
      color: #f6f1e7;
      opacity: 0.85;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    }
    .cta {
      margin-top: 40px;
      border: 0;
      cursor: pointer;
      font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(19px, 5.5vw, 26px);
      letter-spacing: 0.1em;
      color: #3a2305;
      padding: 15px 44px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f7b955 0%, #eb8a1d 100%);
      box-shadow: 0 6px 0 #a35c10, 0 12px 30px rgba(0, 0, 0, 0.45);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      animation: cta-pulse 1.6s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
    }
    .cta:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #a35c10, 0 8px 20px rgba(0, 0, 0, 0.4);
      animation: none;
    }
    /* Pulse = opacity + glow only (fleet pattern: crossy-road pulses opacity).
       No transform — a forever-scaling CTA never goes "stable" for automation
       and hurts text crispness. */
    @keyframes cta-pulse {
      50% { opacity: 0.8; box-shadow: 0 6px 0 #a35c10, 0 0 34px rgba(247, 185, 85, 0.55); }
    }
    .cta.secondary {
      margin-top: 16px;
      font-size: clamp(15px, 4.2vw, 19px);
      padding: 12px 34px;
      color: #f4ede3;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
      animation: none;
    }
    .best-line {
      margin-top: 26px;
      color: #f6f1e7;
      opacity: 0.9;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    }

    /* start menu: canvas stays visible as a dimmed live backdrop */
    #screen-menu {
      background: linear-gradient(180deg, rgba(21, 15, 30, 0.25) 0%, rgba(21, 15, 30, 0.72) 100%);
    }

    /* game over: nearly-opaque focus state */
    #screen-over {
      background: rgba(21, 15, 30, 0.68);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    #screen-over .title { color: #fb8465; font-size: clamp(40px, 12vw, 64px); }
    #over-score {
      margin-top: 8px;
      font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(58px, 19vw, 100px);
      line-height: 1.1;
      color: #fffdf5;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 209, 102, 0.25);
    }
    #over-tag {
      margin-top: 2px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: rgba(244, 237, 227, 0.62);
    }
    #over-tag.newbest { color: #ffd166; text-shadow: 0 0 18px rgba(255, 209, 102, 0.45); }

    /* win: same glass, gold glow behind */
    #screen-win {
      background: rgba(21, 15, 30, 0.68);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    #screen-win::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(255, 209, 102, 0.22) 0%, transparent 60%);
      pointer-events: none;
    }
    #screen-win .title { font-size: clamp(44px, 13vw, 72px); }
    #screen-win > * { position: relative; }
  </style>
  <script type="module" crossorigin src="./assets/index-CYb2_Mz7.js"></script>
</head>
<body>
  <!-- Boot splash (JEE-216): inline SVG + CSS only, no JS — removed by main.js on first rendered frame. -->
  <div id="boot" aria-hidden="true">
    <svg class="boot-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
      <defs>
        <linearGradient id="boot-tile" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fcc02a" />
          <stop offset="1" stop-color="#f59a10" />
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="40" height="40" rx="8" fill="url(#boot-tile)" />
      <ellipse cx="24" cy="14" rx="15" ry="7" fill="#ffffff" opacity="0.18" />
      <text x="24" y="29.5" text-anchor="middle"
            font-family="'Fredoka', 'Nunito', system-ui, sans-serif"
            font-size="14" font-weight="600" fill="#fffdf5">2048</text>
    </svg>
    <div class="boot-title">2048</div>
    <div class="boot-dots"><span></span><span></span><span></span></div>
  </div>
  <div id="game-container"></div>

  <!-- Fleet chrome (JEE-239). Hidden layers are display:none (see .screen/#hud
       rules), so inactive chrome can never eat canvas input (JEE-61/JEE-65).
       The menu ships active in markup as a resilient default; ui-overlay.js
       owns all state transitions once the bundle runs. -->
  <div id="hud" aria-hidden="true">
    <div class="hud-pill" id="hud-score-pill">
      <div class="hud-label">SCORE</div>
      <div class="hud-value" id="hud-score">0</div>
    </div>
    <div class="hud-pill" id="hud-best-pill">
      <div class="hud-label">BEST</div>
      <div class="hud-value" id="hud-best">0</div>
    </div>
  </div>

  <div id="screen-menu" class="screen active" role="dialog" aria-modal="true" aria-label="2048 start menu">
    <h1 class="title">2048</h1>
    <p class="sub">Swipe or use arrow keys &mdash; merge tiles and reach 2048!</p>
    <button class="cta" id="btn-start" type="button">TAP TO START</button>
    <p class="best-line" id="menu-best"></p>
  </div>

  <div id="screen-over" class="screen" role="dialog" aria-modal="true" aria-label="Game over">
    <h2 class="title">GAME OVER</h2>
    <p id="over-score">0</p>
    <p id="over-tag"></p>
    <p class="best-line" id="over-best"></p>
    <button class="cta" id="btn-retry" type="button">TAP TO RETRY</button>
  </div>

  <div id="screen-win" class="screen" role="dialog" aria-modal="true" aria-label="You win">
    <h2 class="title">YOU WIN!</h2>
    <p class="sub">You made the 2048 tile &mdash; congrats!</p>
    <p class="best-line" id="win-score"></p>
    <button class="cta" id="btn-keep-playing" type="button">KEEP PLAYING</button>
    <button class="cta secondary" id="btn-win-retry" type="button">RETRY</button>
  </div>

</body>
</html>
