<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#12121f" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <title>Wordle</title>
    <style>
      @font-face {
        font-family: 'Nunito';
        src: url('fonts/nunito-400.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('fonts/nunito-700.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('fonts/nunito-800.woff2') format('woff2');
        font-weight: 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'Fredoka';
        src: url('fonts/fredoka-600.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #12121f;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        position: fixed;
        inset: 0;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
        color: #f0f0f5;
      }
      body, body *:not(input):not(textarea) {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      img,
      canvas {
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }

      header.hud {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 12px 8px;
        border-bottom: 1px solid #26263a;
      }
      header.hud h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.06em;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-background-fill-color: transparent;
        background-clip: text;
        color: transparent;
      }
      .hud-btns {
        position: absolute;
        right: 8px;
        display: flex;
        gap: 6px;
      }
      .hud-btns button {
        min-width: 44px;
        min-height: 44px;
        padding: 0 10px;
        border: none;
        border-radius: 10px;
        background: #232338;
        color: #f0f0f5;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .hud-btns button:active {
        background: #30304a;
      }

      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .keyboard {
        flex: 0 0 auto;
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        padding: 6px 4px 12px;
        user-select: none;
        touch-action: manipulation;
      }
      .kb-row {
        display: flex;
        justify-content: center;
        gap: 3px;
        margin-bottom: 5px;
      }
      .kb-row button {
        min-width: 0;
        min-height: 44px;
        height: 52px;
        border: none;
        border-radius: 6px;
        background: #3a3a52;
        color: #f0f0f5;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        flex: 1 1 0;
        max-width: none;
      }
      .kb-row button.kb-wide {
        flex: 1.5 1 0;
        font-size: 12px;
      }
      .kb-row button:active {
        filter: brightness(1.3);
      }
      .kb-row button.kb-cor {
        background: #3f8c3f;
      }
      .kb-row button.kb-pos {
        background: #b59a3e;
      }
      .kb-row button.kb-no {
        background: #2a2a3a;
      }
      .kb-row button.kb-clear {
        min-width: 44px;
      }

      .prompt {
        text-align: center;
        font-size: 13px;
        color: #ffb3a0;
        min-height: 18px;
        padding: 2px 0;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(10, 10, 18, 0.82);
        z-index: 20;
        padding: 16px;
      }
      .overlay.open {
        display: flex;
      }
      .card {
        background: #1b1b2c;
        border: 1px solid #2c2c46;
        border-radius: 16px;
        padding: 24px 22px;
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
      }
      .card p.sub {
        margin: 0 0 14px;
        color: #aab;
        font-size: 14px;
      }
      .card .word-reveal {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.15em;
        margin-bottom: 14px;
      }
      .share-grid {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 16px;
        line-height: 1.25;
        margin-bottom: 14px;
        color: #cfcfe0;
        white-space: pre;
      }
      .card button {
        min-width: 44px;
        min-height: 44px;
        padding: 0 18px;
        margin: 4px;
        border: none;
        border-radius: 10px;
        background: #667eea;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .card button.ghost {
        background: #2c2c46;
      }
      .btn {
        min-width: 44px;
        min-height: 44px;
        padding: 0 18px;
        margin: 4px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .btn.primary {
        background: #667eea;
        color: #fff;
      }
      .btn.ghost {
        background: #2c2c46;
        color: #cfcfe0;
      }
      .card p.stub {
        margin: 14px 0 0;
        font-size: 12px;
        color: #8890a8;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Cxr4a5oB.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <h1>WORDLE</h1>
        <div class="hud-btns">
          <button id="btn-help" title="How to play">?</button>
          <button id="btn-new" title="New puzzle">New</button>
        </div>
      </header>
      <div id="stage"></div>
      <div class="prompt" id="prompt"></div>
      <div class="keyboard" id="keyboard"></div>
    </div>

    <div class="overlay" id="modal">
      <div class="card" id="modal-card"></div>
    </div>

  </body>
</html>
