<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0e24" />
    <title>Draw Shield — jeez.games</title>
    <style>
      /* Fleet fonts (JEE-195): self-hosted, same files as crossy-road / water-sort /
         stack-tower. Relative paths so the bundle works from any deploy prefix. */
      @font-face {
        font-family: 'Fredoka';
        src: url('fonts/fredoka-600.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('fonts/nunito-400.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('fonts/nunito-700.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('fonts/nunito-800.woff2') format('woff2');
        font-weight: 800;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #0f1729;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: relative;
        width: 100%; height: 100%;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }

      /* Boot splash (fleet template, JEE-218) — inline markup+CSS paints before the
         game bundle executes; removed on the first rendered frame by main.ts.
         Background matches html/body #0f1729 so the swap has zero flash. */
      #boot {
        position: fixed; inset: 0; z-index: 50;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #0f1729;
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
        animation: boot-in 0.25s ease-out;
      }
      #boot .boot-shield {
        width: 72px; height: 72px;
        filter: drop-shadow(0 0 16px rgba(92, 224, 216, 0.45));
      }
      #boot .boot-title {
        font-size: 30px; font-weight: 600; letter-spacing: 0.02em; color: #7deef2;
        text-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 0 22px rgba(92, 224, 216, 0.45);
      }
      #boot .boot-dots { display: flex; gap: 8px; }
      #boot .boot-dots span {
        width: 8px; height: 8px; border-radius: 50%;
        background: #5ce0d8;
        animation: boot-dot 1s ease-in-out infinite;
      }
      #boot .boot-dots span:nth-child(2) { animation-delay: 0.15s; background: #7c5cff; }
      #boot .boot-dots span:nth-child(3) { animation-delay: 0.3s; background: #ffd700; }
      @keyframes boot-dot {
        0%, 100% { transform: scale(0.6); opacity: 0.4; }
        50% { transform: scale(1); opacity: 1; }
      }
      @keyframes boot-in { from { opacity: 0; } }
    </style>
    <script type="module" crossorigin src="./assets/index-DumP8tS-.js"></script>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg class="boot-shield" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="boot-shield-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7deef2" />
            <stop offset="45%" stop-color="#5ce0d8" />
            <stop offset="100%" stop-color="#7c5cff" />
          </linearGradient>
        </defs>
        <path d="M24 5 C27.5 8.5 32.5 10 39 10.5 C39 23 35.5 33.5 24 43 C12.5 33.5 9 23 9 10.5 C15.5 10 20.5 8.5 24 5 Z" fill="url(#boot-shield-grad)" />
        <path d="M24 11.5 C26.3 13.9 30 15.2 34.5 15.6 C34.5 24 32.2 30.8 24 37.5 C15.8 30.8 13.5 24 13.5 15.6 C18 15.2 21.7 13.9 24 11.5 Z" fill="none" stroke="#eafcff" stroke-width="2" stroke-linejoin="round" opacity="0.9" />
      </svg>
      <div class="boot-title">Draw Shield</div>
      <div class="boot-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="app"></div>
  </body>
</html>
