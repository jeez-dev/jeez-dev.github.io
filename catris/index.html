<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1f3d" />
    <title>Catris — Cat Fit Puzzle</title>
    <style>
      html, body { margin: 0; padding: 0; background: #2a1f3d; height: 100%; overflow: hidden;
        overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
      /* Pin the document so iOS Safari cannot rubber-band or pull-to-refresh. */
      body { position: fixed; inset: 0; }
      img, canvas { -webkit-user-drag: none; }

      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #2a1f3d; }

      /* Portrait 9:16 logic stage, pillarboxed on desktop (mirrors fleet games). */
      #game-wrap { position: relative; aspect-ratio: 9/16;
        width: min(100%, calc(100vh * 9 / 16)); height: min(100%, calc(100vw * 16 / 9));
        width: min(100%, calc(100dvh * 9 / 16)); height: min(100%, calc(100dvw * 16 / 9)); }

      canvas#game { display: block; width: 100%; height: 100%; touch-action: none; }

      #hud { position: absolute; inset: 0; pointer-events: none; }
      #hud > * { pointer-events: auto; }

      #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(120% 80% at 50% 30%, #3a2b57 0%, #2a1f3d 60%); color: #c9a6ff; z-index: 20;
        font: 700 16px/1.3 ui-rounded, system-ui, sans-serif; letter-spacing: 1px; }

      .hud-top { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: center;
        gap: 14px; pointer-events: none; font-variant-numeric: tabular-nums; }
      .stat { background: rgba(20, 14, 32, 0.72); border: 1px solid #5a3f82; border-radius: 12px;
        padding: 6px 14px; text-align: center; min-width: 60px; }
      .stat .k { display: block; font-size: 10px; letter-spacing: 1px; color: #c9a6ff; }
      .stat .value { display: block; font-size: 18px; color: #fff1ff; font-weight: 800; }

      .tray-label { position: absolute; bottom: 152px; left: 0; right: 0; text-align: center;
        color: #c9a6ff; font-size: 11px; letter-spacing: 2px; pointer-events: none; text-transform: uppercase; }

      .controls { position: absolute; left: 0; right: 0; bottom: 12px; display: grid;
        grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 14px; pointer-events: none; }
      .controls .ctl { pointer-events: auto; height: 46px; border-radius: 12px; border: 1px solid #5a3f82;
        background: rgba(40, 28, 62, 0.9); color: #fff1ff; font-size: 14px; font-weight: 800;
        letter-spacing: 1px; touch-action: manipulation; user-select: none; -webkit-user-select: none;
        display: flex; align-items: center; justify-content: center; gap: 6px; }
      .controls .ctl:active { background: #5a3f82; }
      .controls .ctl:disabled { opacity: 0.35; pointer-events: none; }

      .overlay { position: absolute; inset: 0; background: rgba(15, 10, 24, 0.82); display: flex;
        align-items: center; justify-content: center; z-index: 10; }
      .overlay.hidden { display: none; }
      .overlay-card { text-align: center; padding: 28px 22px; border: 1px solid #5a3f82; border-radius: 18px;
        background: rgba(30, 20, 46, 0.96); max-width: 84%; }
      .overlay-title { font-size: 26px; letter-spacing: 2px; color: #fff1ff; margin-bottom: 12px; font-weight: 900; }
      .overlay-body { color: #d9c2ff; font-size: 13px; line-height: 1.5; margin-bottom: 18px; }
      .btn-row { display: flex; gap: 10px; justify-content: center; }
      .btn-primary { height: 46px; min-width: 110px; padding: 0 20px; border-radius: 12px; border: none;
        background: #ff7ab8; color: #2a1f3d; font-size: 14px; font-weight: 800; letter-spacing: 1px; cursor: pointer; }
      .btn-primary:active { background: #e85fa0; }
      .btn-secondary { height: 46px; min-width: 110px; padding: 0 20px; border-radius: 12px;
        border: 1px solid #c9a6ff; background: transparent; color: #d9c2ff; font-size: 14px; font-weight: 800;
        letter-spacing: 1px; cursor: pointer; }

      #stuck-banner { position: absolute; top: 56px; left: 12px; right: 12px; z-index: 8;
        background: rgba(255, 122, 184, 0.16); border: 1px solid #ff7ab8; border-radius: 12px;
        padding: 10px 12px; color: #ffe3f2; font-size: 12px; text-align: center; display: none; }
      #stuck-banner.show { display: block; }
      #stuck-banner button { margin-top: 6px; margin-inline: 4px; height: 32px; padding: 0 12px; border-radius: 8px;
        border: 1px solid #ff7ab8; background: rgba(255, 122, 184, 0.24); color: #fff1ff; font-weight: 700; }
    </style>
    <script type="module" crossorigin src="./assets/index-B0jjvH4z.js"></script>
  </head>
  <body>
    <div id="stage">
      <div id="game-wrap">
        <canvas id="game"></canvas>
        <div id="hud"></div>
        <div id="boot">🐾 Catris</div>
      </div>
    </div>
  </body>
</html>
