<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#101627" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Sudoku — Jeez Grids</title>
    <style>
      html, body { margin: 0; padding: 0; background: #101627; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      body { position: fixed; inset: 0; }
      body *:not(input):not(textarea) { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      img, canvas { -webkit-user-drag: none; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #101627; }
      #game-wrap { position: relative; width: 100%; height: 100%; }
      canvas#game { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud { position: absolute; inset: 0; pointer-events: none; }
      #hud > * { pointer-events: auto; }
      #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; background: radial-gradient(120% 80% at 50% 30%, #1c2744 0%, #101627 65%); color: #9db4ff; z-index: 20;
        font: 600 16px/1.5 ui-monospace, Menlo, Consolas, monospace; text-align: center; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 44px; min-height: 44px; padding: 12px 22px;
        border-radius: 12px; border: none; cursor: pointer;
        font: 700 16px/1 system-ui, sans-serif; color: #fff;
        background: linear-gradient(180deg, #5b7cff 0%, #3755d0 100%);
        box-shadow: 0 4px 14px rgba(55,85,208,.4);
      }
      .btn:active { transform: translateY(1px); }
      .btn.primary { background: linear-gradient(180deg, #5b7cff 0%, #3755d0 100%); }
      .btn.ghost { background: rgba(255,255,255,.08); box-shadow: none; }
      .pad {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
        gap: 8px; padding: 10px 12px 16px;
        background: linear-gradient(180deg, rgba(16,22,39,.85), #101627);
        z-index: 15;
      }
      .pad button {
        min-width: 44px; min-height: 44px; border-radius: 10px; border: none;
        background: rgba(255,255,255,.10); color: #eaf0ff; font: 700 20px/1 system-ui, sans-serif;
        cursor: pointer; touch-action: manipulation;
      }
      .pad button:active { background: rgba(91,124,255,.5); }
      .pill { color: #9db4ff; font: 700 12px/1 ui-monospace, monospace; }
    </style>
    <script type="module" crossorigin src="./assets/index-jhxpgHs3.js"></script>
  </head>
  <body>
    <div id="stage">
      <div id="game-wrap">
        <canvas id="game"></canvas>
        <div id="hud"></div>
        <div id="boot">Sudoku — Jeez Grids</div>
      </div>
    </div>
  </body>
</html>
