    <style>
      @font-face {

        font-weight: 800;
        font-style: normal;
        font-display: swap;
        src: url('./fonts/nunito-800.woff2') format('woff2');
      }
      /* Boot splash (fleet Water Sort pattern, JEE-225): paints inline before the
         JS bundle executes; main.ts removes #boot on the first rendered frame.
         Background = the in-game sky gradient so removal flashes zero. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(180deg, #2b2358 0%, #191338 46%, #0b081f 100%);
        color: #8be04e;
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
        animation: jf-boot-in 0.25s ease-out;
      }
      #boot .boot-icon {
        width: 76px;
        height: 76px;
        filter: drop-shadow(0 0 18px rgba(139, 224, 78, 0.45));
      }
      #boot .boot-title {
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #ffffff;
        text-shadow: 0 0 22px rgba(139, 224, 78, 0.4);
      }
      #boot .boot-title span {
        color: #ffd23f;
        text-shadow: 0 0 22px rgba(255, 210, 63, 0.4);
      }
      #boot .boot-dots {
        display: flex;
        gap: 8px;
      }
      #boot .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8be04e;
        animation: jf-boot-dot 1s ease-in-out infinite;
      }
      #boot .boot-dots span:nth-child(2) {
        animation-delay: 0.15s;
        background: #ff6fa5;
      }
      #boot .boot-dots span:nth-child(3) {
        animation-delay: 0.3s;
        background: #ffd23f;
      }
      @keyframes jf-boot-dot {
        0%,
        100% {
          transform: scale(0.6);
          opacity: 0.4;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes jf-boot-in {
        from {
          opacity: 0;
        }
      }
      /* Critical shell only — full styles in src/game/style.css (bundled by Vite). */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b081f;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
        touch-action: none;
        position: absolute;
        inset: 0;
      }
    </style>
